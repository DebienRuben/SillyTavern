<div class="ns-project-form">
    <h3>Novel settings</h3>
    <label>Title
        <input type="text" data-name="title" class="text_pole" maxlength="300" placeholder="Untitled novel" />
    </label>
    <div class="ns-form-row">
        <label>Author
            <input type="text" data-name="author" class="text_pole" maxlength="500" />
        </label>
        <label>Genre
            <input type="text" data-name="genre" class="text_pole" maxlength="500" placeholder="e.g. Literary mystery" />
        </label>
    </div>
    <div class="ns-form-row">
        <label>Point of view
            <input type="text" data-name="pov" class="text_pole" maxlength="500" placeholder="e.g. Close third, rotating" />
        </label>
        <label>Tense
            <input type="text" data-name="tense" class="text_pole" maxlength="500" placeholder="e.g. Past" />
        </label>
        <label>Target word count
            <input type="number" data-name="targetWords" class="text_pole" min="0" step="1000" placeholder="e.g. 90000" />
        </label>
    </div>
    <label>Style guide
        <textarea data-name="styleGuide" class="text_pole" rows="6" maxlength="20000" placeholder="Voice, tone, rules the AI should follow when writing (used from phase 2 on)."></textarea>
    </label>
</div>
