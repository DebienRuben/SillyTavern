<div class="novel-studio-settings">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b>Novel Studio</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">
            <label class="checkbox_label" for="novel_open_on_startup">
                <input type="checkbox" id="novel_open_on_startup" />
                <span>Open Novel Studio when SillyTavern starts</span>
            </label>
            <label class="checkbox_label" for="novel_novel_only">
                <input type="checkbox" id="novel_novel_only" />
                <span>Novel-only mode: keep Novel Studio open and hide SillyTavern's roleplay features (characters, personas, lorebooks, backgrounds, formatting)</span>
            </label>
            <div class="menu_button menu_button_icon" id="novel_open_studio">
                <i class="fa-solid fa-feather-pointed"></i>
                <span>Open Novel Studio</span>
            </div>
        </div>
    </div>
</div>
