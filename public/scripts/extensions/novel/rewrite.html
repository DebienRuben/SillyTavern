<div class="ns-project-form ns-rewrite-form">
    <h3>Rewrite selection</h3>
    <label>How should it change?
        <textarea data-name="instruction" class="text_pole" rows="3" maxlength="2000" placeholder="e.g. Make it tenser and cut the adverbs"></textarea>
    </label>
    <div class="ns-chips">
        <button type="button" class="ns-chip" data-instruction="Tighten the prose: cut filler, redundancy and weak words.">Tighten</button>
        <button type="button" class="ns-chip" data-instruction="Make it more vivid, with concrete sensory detail.">More vivid</button>
        <button type="button" class="ns-chip" data-instruction="Increase the tension and pace.">More tension</button>
        <button type="button" class="ns-chip" data-instruction="Expand it with more detail and interiority, without changing what happens.">Expand</button>
        <button type="button" class="ns-chip" data-instruction="Condense it to about half the length, keeping what matters.">Condense</button>
        <button type="button" class="ns-chip" data-instruction="Make the dialogue sharper and more natural, with more subtext.">Sharpen dialogue</button>
        <button type="button" class="ns-chip" data-instruction="Fix grammar, spelling and punctuation only. Change nothing else.">Fix grammar only</button>
    </div>
</div>
